# @package _global_
# Fine-tuning regime used for Bengali, Gujarati, Gurumukhi, Kannada, Odia,
# and Malayalam (Section 4.1 of the paper). Requires ckpt_path=<path to that
# language's baseline checkpoint> to actually resume from.
defaults:
  - override /model: parseq

model:
  perm_num: 14
  dropout: 0.4
  lr: 7e-6
