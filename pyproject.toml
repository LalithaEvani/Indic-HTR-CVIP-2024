[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "indichtr"
version = "1.1.0"
description = "PARSeq for Indic handwritten text recognition (CVIP 2024), forked from the Scene Text Recognition Model Hub"
authors = [
  {name = "Darwin Bautista", email = "baudm@users.noreply.github.com"},
  {name = "Evani Lalitha"},
]
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/LalithaEvani/Indic-HTR-CVIP-2024"

[tool.setuptools]
packages = ["indichtr"]
license-files = ["NOTICE", "LICENSE"]
